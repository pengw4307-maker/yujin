/* ==================== 数据备份 / 恢复 ==================== */
const BackupUI = {
  open() {
    Dialog.open('⇅ 数据备份 / 恢复', '' +
      '<div class="form-hint" style="margin-bottom:14px">备份内容:全部会话 + 决策备忘 + 设置。<b>恢复会用文件内容覆盖当前本地数据</b>,请确认后再操作。</div>' +
      '<div class="detail-actions">' +
      '<button class="btn-primary" id="btnDoBackup">↓ 导出备份 JSON</button>' +
      '<button class="hud-btn" id="btnDoRestore">↑ 选择备份文件恢复</button>' +
      '</div><input type="file" id="restoreFile" accept="application/json,.json" style="display:none">',
      [{ label: '关闭', cls: 'hud-btn' }]);
    document.getElementById('btnDoBackup').addEventListener('click', () => this.doBackup());
    document.getElementById('btnDoRestore').addEventListener('click', () => document.getElementById('restoreFile').click());
    document.getElementById('restoreFile').addEventListener('change', (e) => this.doRestore(e.target.files[0]));
  },
  doBackup() {
    const data = { version: 2, exportedAt: Date.now(), config: CONFIG, sessions: STATE.sessions, memos: STATE.memos };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '于禁备份_' + Utils.fmtDateTime(Date.now()).replace(/[: ]/g, '-') + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    Toast.show('备份已导出(会话 + 备忘 + 设置)', 'success');
  },
  doRestore(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.sessions)) throw new Error('不是有效的备份文件');
        Dialog.confirm('恢复将覆盖当前 ' + STATE.sessions.length + ' 个会话与 ' + STATE.memos.length + ' 条备忘,且无法撤销。继续?', () => {
          STATE.sessions = data.sessions;
          STATE.memos = Array.isArray(data.memos) ? data.memos : [];
          if (data.config) {
            Object.keys(CONFIG).forEach((k) => { if (data.config[k] !== undefined) CONFIG[k] = data.config[k]; });
            saveConfig();
          }
          SessionStore.save();
          InfoConsole.saveMemos();
          STATE.currentSessionId = null;
          SessionStore.init();
          InfoConsole.renderMemos();
          Hud.render();
          Hud.refreshModels();  // 恢复的配置可能含新的 Ollama 地址,同步刷新模型下拉
          Toast.show('恢复完成', 'success');
        });
      } catch (err) { Toast.show('备份文件解析失败:' + err.message, 'error'); }
    };
    reader.readAsText(file);
  }
};

/* ==================== 全局事件绑定 ==================== */
function bindGlobal() {
  document.getElementById('btnSettings').addEventListener('click', () => SettingsUI.open());
  document.getElementById('btnHelp').addEventListener('click', () => HelpUI.open());
  document.getElementById('btnUpdate').addEventListener('click', () => Updater.check(false));
  document.getElementById('btnNewSession').addEventListener('click', () => SessionStore.create());
  document.getElementById('btnExportMd').addEventListener('click', () => SessionStore.exportCurrent());
  document.getElementById('btnClearTools').addEventListener('click', () => ToolMonitor.clear());
  document.getElementById('btnDemoTool').addEventListener('click', () => {
    ToolMonitor.inject('web_search', { query: '算力租赁价格 周度跟踪', region: '国内' }, 'success', '返回 12 条结果(演示数据)');
  });
  document.getElementById('hudModelSelect').addEventListener('change', (e) => {
    if (!e.target.value) return;
    CONFIG.model = e.target.value;
    saveConfig();
    Hud.render();
    Toast.show('已切换模型:' + CONFIG.model, 'success');
  });
  document.getElementById('btnBackup').addEventListener('click', () => BackupUI.open());
  document.querySelectorAll('.ws-btn').forEach((b) => b.addEventListener('click', () => Workspace.switchTo(b.dataset.ws)));
  document.getElementById('sessionList').addEventListener('click', (e) => {
    const item = e.target.closest('.session-item');
    if (!item) return;
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'del') SessionStore.del(item.dataset.id);
      else if (act.dataset.act === 'rename') {
        const s = STATE.sessions.find((x) => x.id === item.dataset.id);
        Dialog.open('重命名会话', '<input class="form-input" id="renameInput" value="' + Utils.escapeHtml(s ? s.title : '') + '">', [
          { label: '取消', cls: 'hud-btn' },
          { label: '确定', cls: 'btn-primary', onClick: () => SessionStore.rename(item.dataset.id, document.getElementById('renameInput').value) }
        ]);
        setTimeout(() => { const i = document.getElementById('renameInput'); if (i) { i.focus(); i.select(); } }, 60);
      }
      return;
    }
    SessionStore.switchTo(item.dataset.id);
  });
  document.getElementById('modalCloseBtn').addEventListener('click', () => Dialog.close());
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modalOverlay')) Dialog.close();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { Dialog.close(); return; }
    if (e.ctrlKey && e.key === 'n') { e.preventDefault(); SessionStore.create(); return; }
    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); ChatController.send(); return; }
    if (e.ctrlKey && (e.key === '1' || e.key === '2' || e.key === '3')) {
      e.preventDefault();
      Workspace.switchTo({ '1': 'chat', '2': 'info', '3': 'edit' }[e.key]);
    }
  });
}

/* ==================== 启动 ==================== */
(function boot() {
  SessionStore.init();
  ChatController.init();
  InfoConsole.init();
  EditConsole.init();
  bindGlobal();
  Workspace.switchTo('chat');
  document.getElementById('hudVer').textContent = 'v' + APP_VERSION;  // 版本号与代码同步,避免硬编码漂移
  Hud.startHealth();
  // 静默检查更新(仅当配置了更新源):发现新版弹窗提醒,不静默下载
  setTimeout(() => { if ((CONFIG.updateUrl || '').trim()) Updater.check(true); }, 4000);
  console.log('%c[于禁·指挥中枢 V2.2] 已启动', 'color:#00f0ff;font-weight:bold;font-size:13px');
  console.log('%cCtrl+1 对话 | Ctrl+2 情报 | Ctrl+3 剪辑 | Ctrl+N 新会话', 'color:#8a94a8');
})();
</script>
